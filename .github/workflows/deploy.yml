name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Execute deployment script on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          export PATH=$PATH:/usr/bin:/usr/local/bin
          cd /var/www/tradestat

          # Remove ALL containers (running + stopped) matching our names
          docker ps -a -q --filter name=tradestat | xargs -r docker rm -f 2>/dev/null || true
          docker ps -a -q --filter name=backend   | xargs -r docker rm -f 2>/dev/null || true
          docker ps -a -q --filter name=frontend  | xargs -r docker rm -f 2>/dev/null || true

          git reset --hard
          git clean -fd
          git pull origin main

          COMPOSE_PROJECT_NAME=tradestat /usr/bin/docker compose up -d --build